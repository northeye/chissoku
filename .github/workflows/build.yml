name: build

on:
  push:
    branches-ignore:
      - "release-please-*"
    tags-ignore:
      - "v*.*.*"
      - "v*.*"
      - "v*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        target_os: ["linux", "darwin", "windows"]
        target_arch: ["amd64", "arm64"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build ${{ matrix.target_os }}/${{ matrix.target_arch }}
        env:
          GOOS: ${{ matrix.target_os }}
          GOARCH: ${{ matrix.target_arch }}
          CGO_ENABLED: "0"
        run: go build ./cmd/chissoku

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: "-c ./.golangci-lint.json"
          skip-cache: true
