name: publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  assets:
    permissions:
      contents: write
      packages: write
      pull-requests: read
    strategy:
      matrix:
        target_os: ["linux", "darwin", "windows"]
        target_arch: ["amd64", "arm64"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install 7-Zip
        if: matrix.target_os == 'windows'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Build and package ${{ matrix.target_os }}/${{ matrix.target_arch }}
        env:
          GOOS: ${{ matrix.target_os }}
          GOARCH: ${{ matrix.target_arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p release
          VERSION="$(env -u GOOS -u GOARCH -u CGO_ENABLED go run ./cmd/chissoku -v)"
          if [ "$GOOS" = "windows" ]; then
            go build -o chissoku.exe ./cmd/chissoku
            7zr a "release/chissoku-${VERSION}-windows-${GOARCH}.7z" chissoku.exe
          else
            go build -o chissoku ./cmd/chissoku
            tar -czf "release/chissoku-${VERSION}-${GOOS}-${GOARCH}.tar.gz" chissoku
          fi

      - name: Upload assets
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/*

  docker:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
